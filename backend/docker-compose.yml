version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/genai
      - DATABASE_SYNC_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/genai
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MOORCHEH_API_KEY=${MOORCHEH_API_KEY}
      - MOORCHEH_NAMESPACE=${MOORCHEH_NAMESPACE:-educational-content}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - UPLOAD_DIR=/uploads
    volumes:
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/genai
      - DATABASE_SYNC_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/genai
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MOORCHEH_API_KEY=${MOORCHEH_API_KEY}
      - MOORCHEH_NAMESPACE=${MOORCHEH_NAMESPACE:-educational-content}
      - UPLOAD_DIR=/uploads
    volumes:
      - uploads:/uploads
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: genai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

volumes:
  uploads:
  pgdata:
  redisdata:
