[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "genai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "celery[redis]>=5.4",
    "openai>=1.58",
    "moorcheh-sdk>=0.1",
    "pypdf>=5.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "moviepy>=1.0",
    "tiktoken>=0.8",
    "tenacity>=9.0",
    "slowapi>=0.1",
    "structlog>=24.4",
    "pydantic-settings>=2.7",
    "aiofiles>=24.1",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
